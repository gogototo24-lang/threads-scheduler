name = "threads-scheduler"
main = "src/ai-worker.js"
compatibility_date = "2026-09-01"

[vars]
APP_NAME = "Threads 自動排程器"
PUBLIC_BASE_URL = "https://threads-scheduler.gogototo24.workers.dev"
THREADS_APP_ID = "1726220261769989"
# AI 預設全為 mock；正式 provider 啟用前請用 Worker Secret 設定 provider/API key。
AI_SEARCH_PROVIDER = "mock"
AI_TEXT_PROVIDER = "mock"
AI_IMAGE_PROVIDER = "mock"
AI_VIDEO_PROVIDER = "mock"

[[d1_databases]]
binding = "DB"
database_name = "threads-scheduler-db"
database_id = "b466efec-10b0-4e6e-9ea9-7f174946fdb4"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "threads-scheduler-media"

[triggers]
crons = ["* * * * *"]
