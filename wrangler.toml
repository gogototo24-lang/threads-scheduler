name = "threads-scheduler"
main = "src/ai-worker.js"
compatibility_date = "2026-09-01"

[vars]
APP_NAME = "Threads 自動排程器"
PUBLIC_BASE_URL = "https://threads-scheduler.gogototo24.workers.dev"
THREADS_APP_ID = "1726220261769989"
# AI 預設全為 mock；正式 provider 啟用前請用 Worker Secret 設定 provider/API key。
AI_SEARCH_PROVIDER = "mock"
AI_TEXT_PROVIDER = "mock"
AI_IMAGE_PROVIDER = "mock"
AI_VIDEO_PROVIDER = "mock"

# RunningHub 低成本測片 provider（未配置前不會呼叫、不會扣點）
RUNNINGHUB_API_BASE_URL = "https://www.runninghub.ai"
RUNNINGHUB_VIDEO_WEBAPP_ID = "2109201035672047617"
RUNNINGHUB_VIDEO_NODE_INFO_JSON = '[{"nodeId":"241","fieldName":"image","fieldValue":"{{IMAGE}}"},{"nodeId":"213","fieldName":"value","fieldValue":"{{PROMPT}}"},{"nodeId":"197","fieldName":"value","fieldValue":"{{DURATION}}"},{"nodeId":"188","fieldName":"aspect_ratio","fieldValue":"{{ASPECT_RATIO}}"},{"nodeId":"188","fieldName":"megapixels","fieldValue":"{{MEGAPIXELS}}"},{"nodeId":"198","fieldName":"steps","fieldValue":"{{STEPS}}"},{"nodeId":"195","fieldName":"noise_seed","fieldValue":"{{SEED}}"}]'
RUNNINGHUB_VIDEO_DURATION = "5"
RUNNINGHUB_VIDEO_ASPECT_RATIO = "9:16 (Portrait Widescreen)"
RUNNINGHUB_VIDEO_MEGAPIXELS = "0.4"
RUNNINGHUB_VIDEO_STEPS = "24"
RUNNINGHUB_VIDEO_SEED = "632121643472834"
RUNNINGHUB_VIDEO_FPS = "24"
RUNNINGHUB_TASK_TIMEOUT_SECONDS = "900"
RUNNINGHUB_MAX_UPLOAD_MB = "30"
# 注意：ASPECT_RATIO 必須填入實際 AI App LIST 節點接受的精確值；目前不自動猜測標籤。
# 選填：只有你知道實際每 GPU 分鐘成本時才設定，用於「估算 NT$」顯示；0 表示只記 taskCostTime。
RUNNINGHUB_EST_NTD_PER_GPU_MIN = "0"

# CatPaw AI Factory P4 Multi-LLM Council
# Safe default: adapters/routes are deployed but no paid model calls run until explicitly enabled.
FACTORY_P4_ENABLED = "false"
FACTORY_P4_AUTO_EXECUTE = "false"
COUNCIL_OPENAI_MODEL = "gpt-6-luna"
COUNCIL_ANTHROPIC_MODEL = "claude-sonnet-5"
COUNCIL_ANTHROPIC_MAX_TOKENS = "5000"
COUNCIL_META_MODEL = "muse-spark-1.3"

# CatPaw AI Factory P3 control plane
FACTORY_P3_ENABLED = "true"
FACTORY_P3_MAX_RETRIES = "2"
AI_MUSIC_STUDIO_URL = "https://ai-music-studio-v2.onrender.com"

# CatPaw AI Factory P2 safety gates
FACTORY_LIVE_ENABLED = "false"
FACTORY_PUBLISH_ENABLED = "false"
FACTORY_P2_MAX_TWD = "15"
FACTORY_P2_DURATION_SECONDS = "5"

[[d1_databases]]
binding = "DB"
database_name = "threads-scheduler-db"
database_id = "b466efec-10b0-4e6e-9ea9-7f174946fdb4"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "threads-scheduler-media"

[triggers]
crons = ["* * * * *"]
