name: Validate P5 Taiwan Trend Radar

on:
  pull_request:
    paths:
      - 'src/p5-trend-radar.js'
      - 'src/ai-worker.js'
      - 'tests/p5-trend-radar.test.mjs'
      - 'migrations/0014_p5_search_trend_radar.sql'
      - 'wrangler.toml'
      - '.github/workflows/validate-p5-trend-radar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check all new JS syntax
        run: |
          node --check src/p5-trend-radar.js
          node --check src/ai-worker.js
          node --check tests/p5-trend-radar.test.mjs
      - name: Radar isolation and reliability
        run: node --test tests/p5-trend-radar.test.mjs
      - name: Existing P5 official scout regression
        run: node --test tests/p5-official-autoscout.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Read-only live Google Trends RSS probe
        shell: bash
        run: |
          curl --location --silent --show-error --max-time 18 \
            --write-out 'GOOGLE_TRENDS_HTTP=%{http_code} CONTENT_TYPE=%{content_type} BYTES=%{size_download}\n' \
            --output /tmp/tw-trends.xml 'https://trends.google.com/trending/rss?geo=TW' || true
          python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('/tmp/tw-trends.xml').getroot(); ns={'ht':'https://trends.google.com/trending/rss'}; items=r.findall('.//item'); print('RSS_ITEMS',len(items)); [(print('TREND',x.findtext('title'),x.findtext('ht:approx_traffic',namespaces=ns),x.findtext('pubDate'))) for x in items[:3]]" || true
      - name: Worker dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-trends-test
