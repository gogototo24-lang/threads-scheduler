name: Validate P5 Authorization Console

on:
  pull_request:
    paths:
      - "src/p5-auth.js"
      - "src/ai-worker.js"
      - "tests/p5-auth.test.mjs"
      - ".github/workflows/validate-p5-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Syntax checks
        run: |
          node --check src/p5-auth.js
          node --check src/ai-worker.js
          node --check tests/p5-auth.test.mjs
      - name: Authentication and secret safety tests
        run: node --test tests/p5-auth.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Dry-run Cloudflare build
        run: npx wrangler deploy --dry-run --outdir .wrangler-auth-test
