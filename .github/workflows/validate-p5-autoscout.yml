name: Validate P5 Native Official Scout

on:
  pull_request:
    paths:
      - "src/p5-official-autoscout.js"
      - "src/ai-worker.js"
      - "migrations/0013_p5_official_autoscout.sql"
      - "wrangler.toml"
      - "tests/p5-official-autoscout.test.mjs"
      - ".github/workflows/validate-p5-autoscout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: JS syntax
        run: |
          node --check src/p5-official-autoscout.js
          node --check src/ai-worker.js
          node --check tests/p5-official-autoscout.test.mjs
      - name: End-to-end simulated RSS to Threads publication and failure tests
        run: node --test tests/p5-official-autoscout.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build Cloudflare Worker without deployment
        run: npx wrangler deploy --dry-run --outdir .wrangler-scout-test
