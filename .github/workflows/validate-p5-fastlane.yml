name: Validate P5 Fastlane Repair

on:
  pull_request:
    paths:
      - "src/ai-worker.js"
      - "src/factory-p5.js"
      - "src/p5-fastlane.js"
      - "tests/p5-fastlane.test.mjs"
      - ".github/workflows/validate-p5-fastlane.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: JavaScript syntax checks
        run: |
          node --check src/ai-worker.js
          node --check src/factory-p5.js
          node --check src/p5-fastlane.js
          node --check tests/p5-fastlane.test.mjs
      - name: Test P5 scoped authorization flow, safe no-duplicate publishing and idempotency
        run: node --test tests/p5-fastlane.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build Worker without deploying or publishing
        run: npx wrangler deploy --dry-run --outdir .wrangler-p5-test
