name: P5 Taiwan Search Trends Native Ingest

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    paths:
      - 'scripts/p5_trends_to_d1.py'
      - '.github/workflows/p5-trends-github-ingest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-trends-d1
  cancel-in-progress: false

jobs:
  fetch-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "114801b2a23dcd8906ce0b087922f8c9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require the existing Cloudflare deploy secret
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN missing; no D1 write performed"
            exit 1
          fi
      - name: Fetch actual public Google Taiwan Trends RSS
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 20 \
            --retry 2 --retry-delay 2 \
            'https://trends.google.com/trending/rss?geo=TW' \
            --output /tmp/catpaw-trends.xml
          test -s /tmp/catpaw-trends.xml
      - name: Validate RSS and build safe SQL
        run: python3 scripts/p5_trends_to_d1.py --rss /tmp/catpaw-trends.xml --output /tmp/catpaw-trends.sql
      - name: Install dependencies
        run: npm ci
      - name: Commit discovery signals to existing Cloudflare D1 (no social posts)
        run: npx wrangler d1 execute threads-scheduler-db --remote --file=/tmp/catpaw-trends.sql
      - name: Read-back public radar summary
        run: |
          curl --fail --silent --show-error --max-time 20 \
            'https://threads-scheduler.gogototo24.workers.dev/api/factory/p5/trends/public' \
            | python3 -c "import sys,json; x=json.load(sys.stdin); print('LATEST_STATUS:',x.get('latest',{}).get('status'));print('TOP_TRENDS_COUNT:',len(x.get('top_trends',[])));print('AUTO_POSTS_FROM_TRENDS:',x.get('publishes_directly')); print('TOP3:',[a.get('keyword') for a in x.get('top_trends',[])[:3]])"
