name: Validate P5 Original Content Pipeline
on:
  pull_request:
    paths:
      - 'src/p5-original-*.js'
      - 'src/ai-worker.js'
      - 'tests/p5-original-*.test.mjs'
      - '.github/workflows/validate-p5-original.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Syntax and original-content quality tests
        run: |
          node --check src/p5-original-quality.js
          node --check src/p5-original-pipeline.js
          node --check src/p5-original-publisher.js
          node --check src/ai-worker.js
          node --test tests/p5-original-quality.test.mjs tests/p5-original-pipeline.test.mjs tests/p5-original-publisher.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Cloudflare Worker dry run only
        run: npx wrangler deploy --dry-run --outdir .wrangler-original-test
