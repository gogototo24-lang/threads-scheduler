name: Validate A-line 4x15 contract
on:
  push:
    branches:
      - feature/a-line-four-by-15s-test
  pull_request:
    paths:
      - 'src/a-line-4x15.mjs'
      - 'tests/a-line-4x15.test.mjs'
      - '.github/workflows/validate-a-line-4x15.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/a-line-4x15.test.mjs
